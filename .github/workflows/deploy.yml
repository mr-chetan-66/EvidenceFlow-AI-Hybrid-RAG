name: Deploy EvidenceFlow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0aebf939c673d7b05" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo Starting EvidenceFlow deployment...",
              "cd /home/ubuntu/EvidenceFlow-AI-Hybrid-RAG",
              "echo Pulling latest code...",
              "sudo -u ubuntu git fetch origin main",
              "sudo -u ubuntu git reset --hard origin/main",
              "echo Updating Python dependencies...",
              "sudo -u ubuntu bash -c \"source /home/ubuntu/EvidenceFlow-AI-Hybrid-RAG/.venv/bin/activate && pip install -r /home/ubuntu/EvidenceFlow-AI-Hybrid-RAG/requirements_render.txt\"",
              "echo Building frontend...",
              "cd /home/ubuntu/EvidenceFlow-AI-Hybrid-RAG/frontend",
              "sudo -u ubuntu npm install",
              "sudo -u ubuntu env VITE_API_URL=/api npm run build",
              "echo Deploying frontend...",
              "rm -rf /var/www/evidenceflow/*",
              "cp -r dist/* /var/www/evidenceflow/",
              "echo Restarting backend...",
              "systemctl restart evidenceflow",
              "echo Reloading Nginx...",
              "nginx -t",
              "systemctl reload nginx",
              "echo Deployment completed successfully."
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0aebf939c673d7b05"

          echo "Deployment command completed."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0aebf939c673d7b05" \
            --query "StandardOutputContent" \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0aebf939c673d7b05" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi
