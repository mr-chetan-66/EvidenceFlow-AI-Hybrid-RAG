services:
  # FastAPI Backend Service
  - type: web
    name: evidenceflow-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirement.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: evidenceflow-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://evidenceflow-frontend.onrender.com
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1

  # React Frontend Service
  - type: web
    name: evidenceflow-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://evidenceflow-backend.onrender.com

# PostgreSQL Database
databases:
  - name: evidenceflow-db
    plan: free
    databaseName: evidenceflow
    user: evidenceflow_user